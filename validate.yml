name: Validate project
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check docs/app.js && node --check extension/popup.js
      - run: python -m json.tool extension/manifest.json > /dev/null
