<!doctype html><html><head><meta charset="utf-8"><style>body{font:14px system-ui;width:335px;padding:14px;color:#15263c}h2{margin-top:0}label{display:block;margin-top:10px;font-weight:600}input,select{box-sizing:border-box;width:100%;padding:8px;margin-top:4px;border:1px solid #bdc8d5;border-radius:6px}button{padding:10px;margin-top:12px;background:#125b9a;color:white;border:0;border-radius:7px;cursor:pointer}#status{white-space:pre-wrap;font-size:12px;color:#345;max-height:160px;overflow:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}</style></head><body><h2>🚆 Railway Assistant</h2><p>Strict class lock · No automatic purchase</p><div class="grid"><div><label>From<input id="from"></label></div><div><label>To<input id="to"></label></div><div><label>Date<input id="date" type="date"></label></div><div><label>Passengers<select id="passengers"><option>1</option><option>2</option><option>3</option><option>4</option></select></label></div></div><label>Locked class<input id="seatClass" placeholder="AC_S"></label><label>Preferred train / time<input id="train"></label><button id="save">Save</button> <button id="fill">Assist form fill</button> <button id="inspect">Inspect fields</button><br><button id="import">Import JSON</button><input id="file" type="file" accept="application/json" hidden><div id="status" role="status"></div><script src="popup.js"></script></body></html>
